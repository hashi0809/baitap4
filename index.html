<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Bài tập 4: Dựng bố cục desktop từ Figma bằng HTML và CSS Flexbox."
    />
    <title>Bài tập 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-layout">
        <div class="box logo">Logo</div>
        <div class="box menu">Menu</div>
        <div class="box header-button">Button</div>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="Giới thiệu">
        <div class="container hero-layout">
          <div class="box hero-content">Content</div>
          <div class="box hero-image">Image</div>
        </div>
      </section>

      <section class="section features" aria-labelledby="features-title">
        <div class="container">
          <h1 id="features-title" class="box section-title">Title</h1>
          <div class="card-list feature-list">
            <div class="box feature-card">Text</div>
            <div class="box feature-card">Text</div>
            <div class="box feature-card">Text</div>
            <div class="box feature-card">Text</div>
            <div class="box feature-card">Text</div>
            <div class="box feature-card">Text</div>
          </div>
        </div>
      </section>

      <section class="section collection" aria-labelledby="collection-title">
        <div class="container">
          <h2 id="collection-title" class="box section-title">Title</h2>
          <div class="card-list collection-list">
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
          </div>
        </div>
      </section>

      <section class="section related" aria-labelledby="related-title">
        <div class="container">
          <h2 id="related-title" class="box section-title">Title</h2>
          <div class="card-list related-list">
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
            <div class="box small-card">Text</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">Footer</footer>
  </body>
</html>
